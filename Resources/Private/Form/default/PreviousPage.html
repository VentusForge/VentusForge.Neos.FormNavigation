<f:layout name="Neos.Form:Field" />
<f:section name="field">
    <div class="{element.renderingOptions.containerClassAttribute}">
        <f:form.button
            name="__currentPage"
            value="{element.renderingOptions.__navigation_previousPageIndex}"
            formnovalidate="formnovalidate"
            class="{element.renderingOptions.btnClasses}"
        >
            <f:if condition="{element.properties.text} != ''">
                <f:then>
                    {element.properties.text}
                </f:then>
                <f:else>
                    <f:translate
                        id="{element.renderingOptions.translationId}"
                        source="{element.renderingOptions.translationSource}"
                        package="{element.renderingOptions.translationPackage}"
                    />
                </f:else>
            </f:if>
        </f:form.button>
    </div>
</f:section>
